<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>التطبيقات - migo store</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
overflow-x:hidden;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f5f5;
color:#222;
}

a{
text-decoration:none;
color:inherit;
}

header{
background:#fff;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:10;
}

.nav{
max-width:1100px;
margin:auto;
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:22px;
font-weight:bold;
}

.navlinks{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.navlinks a{
padding:9px 11px;
border-radius:8px;
font-size:14px;
}

.navlinks a:hover{
background:#eee;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
padding:25px 16px;
}

h1{
margin-top:0;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:15px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:15px;
padding:15px;
min-width:0;
}

.app-top{
display:flex;
gap:13px;
align-items:center;
}

.app-icon{
width:70px;
height:70px;
border-radius:15px;
object-fit:cover;
background:#eee;
border:1px solid #ddd;
}

.app-name{
margin:0 0 7px;
font-size:18px;
}

.app-desc{
margin:0;
color:#666;
font-size:13px;
line-height:1.6;
}

.meta{
font-size:12px;
color:#777;
margin-top:12px;
}

button{
width:100%;
margin-top:13px;
padding:11px;
border:0;
border-radius:9px;
background:#222;
color:#fff;
cursor:pointer;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:40px;
background:#fff;
border:1px solid #ddd;
border-radius:15px;
color:#777;
}

.hidden{
display:none!important;
}

@media(max-width:700px){

.nav{
flex-direction:column;
align-items:stretch;
}

.navlinks{
display:grid;
grid-template-columns:repeat(2,1fr);
}

.navlinks a{
text-align:center;
background:#f2f2f2;
}

.container{
padding:20px 12px;
}

.grid{
grid-template-columns:1fr;
}

}

@media(max-width:360px){

.navlinks{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
migo store
</div>

<nav class="navlinks">

<a href="index.html">الرئيسية</a>

<a href="apps.html">التطبيقات</a>

<a href="login.html">تسجيل الدخول</a>

<a href="account.html">الحساب</a>

<a href="upload.html">رفع تطبيق</a>

<a
href="admin.html"
id="adminLink"
class="hidden"
>
الإدارة
</a>

</nav>

</div>

</header>

<main class="container">

<h1>التطبيقات والألعاب</h1>

<div id="appsGrid" class="grid">

<div class="empty">
جاري تحميل التطبيقات...
</div>

</div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
query,
where,
doc,
getDoc,
updateDoc,
increment
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDIVIiWxAGPRN1diUfnX3VG4XFEkhpQqi8",
authDomain:"migo-store.firebaseapp.com",
projectId:"migo-store",
storageBucket:"migo-store.firebasestorage.app",
messagingSenderId:"418438022956",
appId:"1:418438022956:web:832586300ca651a3124e89",
measurementId:"G-SMNL93EJSE"
};

const ADMIN_EMAIL="amgadgad358@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const grid=document.getElementById("appsGrid");
const adminLink=document.getElementById("adminLink");

function esc(value){

return String(value||"").replace(/[&<>"']/g,function(char){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];

});

}

async function loadApps(){

try{

const result=await getDocs(
query(
collection(db,"apps"),
where("status","==","approved")
)
);

const apps=result.docs.map(function(item){

return {
id:item.id,
...item.data()
};

});

apps.sort(function(a,b){

return (b.createdAt?.seconds||0)-
(a.createdAt?.seconds||0);

});

if(!apps.length){

grid.innerHTML=
'<div class="empty">لا توجد تطبيقات منشورة.</div>';

return;

}

grid.innerHTML=apps.map(function(item){

return `
<div class="card">

<div class="app-top">

<img
class="app-icon"
src="${esc(item.iconUrl)}"
alt=""
>

<div>

<h2 class="app-name">
${esc(item.name)}
</h2>

<p class="app-desc">
${esc(item.description)}
</p>

</div>

</div>

<div class="meta">
${esc(item.category||"أخرى")}
-
الإصدار ${esc(item.version||"1.0")}
-
${Number(item.downloads||0)} تحميل
</div>

<button data-id="${item.id}">
تحميل APK
</button>

</div>
`;

}).join("");

grid.querySelectorAll("button[data-id]").forEach(function(button){

button.addEventListener("click",async function(){

try{

const snap=await getDoc(
doc(db,"apps",button.dataset.id)
);

if(!snap.exists()) return;

const data=snap.data();

window.open(data.apkUrl,"_blank");

await updateDoc(
doc(db,"apps",button.dataset.id),
{
downloads:increment(1)
}
);

}catch(error){

alert("تعذر تحميل التطبيق.");

}

});

});

}catch(error){

grid.innerHTML=
'<div class="empty">تعذر تحميل التطبيقات.</div>';

}

}

onAuthStateChanged(auth,function(user){

const isAdmin=
user &&
String(user.email||"").toLowerCase()===
ADMIN_EMAIL.toLowerCase();

adminLink.classList.toggle("hidden",!isAdmin);

});

loadApps();

</script>

</body>
</html>
