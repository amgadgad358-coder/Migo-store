<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>تسجيل الدخول - migo store</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f5f5;
color:#222;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}

.login-box{
width:100%;
max-width:430px;
background:#fff;
border:1px solid #ddd;
border-radius:16px;
padding:24px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
margin-top:0;
font-size:27px;
}

p{
color:#666;
line-height:1.7;
}

button{
width:100%;
min-height:46px;
border:0;
border-radius:10px;
padding:12px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

#loginBtn{
background:#222;
color:#fff;
}

#logoutBtn{
background:#e8e8e8;
color:#222;
display:none;
}

#userBox{
display:none;
margin-top:15px;
padding:13px;
border-radius:10px;
background:#f3f3f3;
word-break:break-word;
}

#status{
text-align:center;
min-height:25px;
margin-top:12px;
font-size:13px;
color:#666;
}

.admin{
display:none;
margin-top:10px;
padding:7px 10px;
background:#222;
color:#fff;
border-radius:7px;
font-size:12px;
text-align:center;
}

@media(max-width:400px){

.login-box{
padding:18px;
}

h1{
font-size:23px;
}

button{
font-size:14px;
}

}

</style>

</head>

<body>

<main class="login-box">

<h1>تسجيل الدخول</h1>

<p>
سجّل الدخول باستخدام حساب Google.
بعد تسجيل الدخول سيظهر زر تسجيل الخروج هنا.
</p>

<button id="loginBtn">
تسجيل الدخول باستخدام Google
</button>

<button id="logoutBtn">
تسجيل الخروج
</button>

<div id="userBox">

<div>
الحساب الحالي:
</div>

<strong id="userEmail"></strong>

<div
id="adminBadge"
class="admin"
>
حساب الإدارة
</div>

</div>

<div id="status"></div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyDIVIiWxAGPRN1diUfnX3VG4XFEkhpQqi8",
authDomain:"migo-store.firebaseapp.com",
projectId:"migo-store",
storageBucket:"migo-store.firebasestorage.app",
messagingSenderId:"418438022956",
appId:"1:418438022956:web:832586300ca651a3124e89",
measurementId:"G-SMNL93EJSE"
};

const ADMIN_EMAIL="amgadgad358@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const userBox=document.getElementById("userBox");
const userEmail=document.getElementById("userEmail");
const adminBadge=document.getElementById("adminBadge");
const status=document.getElementById("status");

loginBtn.addEventListener("click",async function(){

status.textContent="جاري تسجيل الدخول...";

try{

await signInWithPopup(auth,provider);

}catch(error){

console.error(error);

status.textContent=
"تعذر تسجيل الدخول: "+
(error.message||"خطأ غير معروف");

}

});

logoutBtn.addEventListener("click",async function(){

logoutBtn.disabled=true;

try{

await signOut(auth);

status.textContent="تم تسجيل الخروج.";

}catch(error){

status.textContent=
"تعذر تسجيل الخروج.";

}

logoutBtn.disabled=false;

});

onAuthStateChanged(auth,function(user){

if(user){

loginBtn.style.display="none";

logoutBtn.style.display="block";

userBox.style.display="block";

userEmail.textContent=user.email||"";

const isAdmin=
String(user.email||"").toLowerCase()===
ADMIN_EMAIL.toLowerCase();

adminBadge.style.display=
isAdmin?"block":"none";

status.textContent="تم تسجيل الدخول.";

}else{

loginBtn.style.display="block";

logoutBtn.style.display="none";

userBox.style.display="none";

adminBadge.style.display="none";

}

});

</script>

</body>
</html>
